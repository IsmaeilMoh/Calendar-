name: Update economic news
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-economic-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate latest economic RSS headlines
        run: python scripts/update_news.py
      - name: Publish updated headlines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-live.json
          git diff --cached --quiet || (git commit -m "chore: refresh economic news" && git pull --rebase && git push)
