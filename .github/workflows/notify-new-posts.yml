name: Notify followers of new trade ideas
on:
  push:
    branches: [main]
    paths:
      - 'recs.json'
      - 'analyses.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notify-new-posts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find new posts and notify opted-in subscribers
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          BEFORE_REV: ${{ github.event.before }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python scripts/notify_new_posts.py
