<!doctype html><html lang="ar" dir="rtl" data-ict-page="home" data-theme="dark"><head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="ui-icons.css"><style>body{margin:0;background:#0c141b}.header{width:100%;background:#15252e;color:#e8f6ef}.header-inner{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;gap:8px;max-width:1120px;margin:auto}.brand{display:flex;align-items:center;min-width:0;gap:8px;color:inherit;text-decoration:none}.brand img{width:44px;height:44px}.brand span{display:grid}.brand-name{font-size:15px}.brand-sub{font-size:9px}.navigation{display:flex;gap:8px}.header-actions{display:flex;align-items:center}button{cursor:pointer}#theme-label{color:inherit}@media(max-width:750px){.navigation{display:none}}</style><script defer src="ui-icons.js"></script></head><body><header class="header"><div class="header-inner"><a class="brand"><img alt="logo" src="/logo-placeholder.png"><span><b class="brand-name">ICT بالعربي</b><small class="brand-sub">MARKET INTELLIGENCE</small></span></a><nav class="navigation"><a data-page="home">الرئيسية</a></nav><div class="header-actions"><button id="theme" class="icon-btn theme-btn"><span id="theme-label">داكن</span></button></div></div></header><script>document.getElementById('theme').addEventListener('click',()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.getElementById('theme-label').textContent='تلقائي';});</script></body></html>
