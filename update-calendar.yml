name: Update calendar data
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download feed
        run: |
          curl -fsSL -A "Mozilla/5.0" "https://nfs.faireconomy.media/ff_calendar_thisweek.json" -o new.json || exit 0
          if jq -e 'type=="array" and length>0' new.json >/dev/null 2>&1; then mv new.json ff.json; fi
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain ff.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ff.json
            git commit -m "Update calendar data"
            git push
          fi
